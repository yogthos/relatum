name: tests

on:
  push:
    branches: [main]
  pull_request:

# pinned: a new jolt release would change what CI runs on
env:
  JOLT_VERSION: v0.8.23

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Install through jolt's own install script rather than resolving the
      # release asset here: it owns the archive and binary naming and verifies
      # the checksum.
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION" --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Fast suite
        run: jolt -M:test
      - name: Doc examples
        run: jolt docs/verify.clj

  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # deps.edn pulls writ in as {:local/root "../jlt-commons/writ"}, a
      # sibling of the repo, so check it out inside the workspace and link it
      # to the sibling path the classpath expects.
      - uses: actions/checkout@v4
        with:
          repository: jlt-commons/writ
          path: jlt-commons/writ
      - name: Link writ to the path deps.edn expects
        run: |
          set -euo pipefail
          ln -s "${GITHUB_WORKSPACE}/jlt-commons" \
                "$(dirname "${GITHUB_WORKSPACE}")/jlt-commons"
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION" --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Writ specs
        run: jolt -M:specs
